# This file configures the static analysis as described in
# https://dart.dev/guides/language/analysis-options

include: package:lints/recommended.yaml

linter:
  rules:
    - always_declare_return_types
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - empty_statements
    - library_names
    - library_prefixes
    - list_remove_unrelated_type
    - no_duplicate_case_values
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs: false # We can enable this later for strict doc check
    - slash_for_doc_comments
    - type_init_formals
    - unawaited_futures
    - unnecessary_const
    - unnecessary_new
    - unnecessary_this
    - unrelated_type_equality_checks
    - use_rethrow_when_possible
    - valid_regexps

analyzer:
  exclude:
    - "build/**"
    - "**/*.g.dart"
